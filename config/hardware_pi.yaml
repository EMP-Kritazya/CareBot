# Robot hardware settings. Owned by Hardware (see docs/HARDWARE.md).
# Every number the Pi drivers use lives here. Calibrate on the real robot and commit the result.

pantilt:
  # Two Hitec D625MW servos, powered by the 6 V battery (never the Pi's 5 V pins); battery minus
  # tied to Pi GND pin 34. See docs/wiring.md.
  # pulse_us = center_us + (deg + center_trim_deg) * us_per_deg  (negated when invert: true),
  # clamped to [min_us, max_us]. Hitec documents 900 to 2100 us. us_per_deg is a first guess:
  # calibrate everything with `python -m apps.hwcheck pantilt` and commit the result.
  pwm_chip: 0              # check /sys/class/pwm (Pi 5: often 0 on kernel 6.6+, 2 on older)
  pan:  {channel: 0, gpio: 12, min_us: 900, max_us: 2100, center_us: 1500, us_per_deg: 10.0, center_trim_deg: 0, limit_deg: [-60, 60], invert: false}
  tilt: {channel: 1, gpio: 13, min_us: 900, max_us: 2100, center_us: 1500, us_per_deg: 10.0, center_trim_deg: 0, limit_deg: [-30, 45], invert: false}
  home_deg: [0, 0]
  settle_ms: 250           # D625MW: 0.15 s per 60 deg at 6 V; can likely drop once tracking is tuned
  hz: 50

eyes:
  num_pixels: 12           # count the LEDs on your ring or strip piece (the checkout ring has 24)
  spi_bus: 0               # SPI0 MOSI = GPIO 10
  pixel_order: GRB
  max_brightness: 0.3

buzzer:
  gpio: 17
  type: active             # active = beeps by itself when powered | passive = needs a tone (bare ELEGOO passive buzzer)
  passive_hz: 2800         # only used when type is passive
  alarm_on_ms: 400
  alarm_off_ms: 300

button:
  gpio: 27
  pull_up: true            # true = plain button between GPIO 27 and GND | false = Grove-style module that outputs 3.3 V
  bounce_ms: 50

camera:
  type: usb                # csi = ribbon-cable Pi camera (on CAM/DISP 1) via picamera2 | usb = webcam via OpenCV
  csi_num: 0               # csi: libcamera's camera number (0 when it's the only camera attached)
  size: [1280, 720]        # widest view on the Logitech (16:9); YOLO resizes to 640 anyway
  fourcc: MJPG             # usb: compressed mode. Without it the Logitech gives 5 fps above 640x360
  index: 0                 # usb: /dev/video0
  rotate: 0                # 0 | 90 | 180 | 270, if the head mounts the camera rotated

audio:
  output: "default"        # set to the JBL's PipeWire sink name from `wpctl status`
  output_fallback: "default"
  input: "default"         # INMP441 from `arecord -l`; webcam mic until it arrives
  input_rate: 16000
