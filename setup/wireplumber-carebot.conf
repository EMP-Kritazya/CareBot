# CareBot audio priorities (WirePlumber 0.5): the JBL speaks, the Logitech webcam's mic hears.
#   Speaker: the Bluetooth JBL whenever it's connected, then a USB speaker / sound card, then HDMI.
#            (The Brio 101 webcam has no speaker; the buzzer still sounds the alarm in every case.)
#   Mic:     the Brio 101's built-in mic (Logitech USB vendor id 046d). There is no INMP441.
#
# Install on the Pi (once):
#   mkdir -p ~/.config/wireplumber/wireplumber.conf.d
#   cp ~/CareBot/setup/wireplumber-carebot.conf ~/.config/wireplumber/wireplumber.conf.d/50-carebot.conf
#   rm -f ~/.local/state/wireplumber/default-nodes     # forget defaults chosen by hand, so these apply
#   systemctl --user restart wireplumber
#   wpctl status        # the JBL (when connected) has the * under Sinks, "Brio 101" under Sources
# CareBot prints the speaker and mic it uses at start-up and warns if the speaker isn't the JBL.

monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { priority.session = 2000, priority.driver = 2000 } }
  }
]

monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.usb-*" } ]
    actions = { update-props = { priority.session = 1500, priority.driver = 1500 } }
  }
  {
    matches = [ { node.name = "~alsa_input.usb-046d_*" } ]
    actions = { update-props = { priority.session = 2000, priority.driver = 2000 } }
  }
]
